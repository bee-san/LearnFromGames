name: Release

# Push a tag like v0.2.0 and this builds the signed APKs and attaches them to a GitHub release,
# which is where Obtainium looks. It needs four repository secrets:
#   LFG_KEYSTORE_BASE64   the release keystore, base64 encoded (base64 -w0 release.jks)
#   LFG_STOREPASSWORD     its password
#   LFG_KEYALIAS          the key's alias
#   LFG_KEYPASSWORD       the key's password
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-36 build-tools;36.0.0 ndk;29.0.14206865
      # hoshidicts needs CMake 3.31; the SDK's own CMake packages are older.
      - name: CMake and Ninja
        run: |
          pipx install cmake==3.31.6
          sudo apt-get update && sudo apt-get install -y ninja-build
          cmake --version
      - uses: gradle/actions/setup-gradle@v4
      - name: Release key
        env:
          LFG_KEYSTORE_BASE64: ${{ secrets.LFG_KEYSTORE_BASE64 }}
        run: |
          # No key, no release: an APK signed with a debug key could never be updated.
          test -n "$LFG_KEYSTORE_BASE64" || { echo "::error::The LFG_KEYSTORE_BASE64 secret is not set."; exit 1; }
          echo "$LFG_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/screenai
          key: screenai-${{ hashFiles('tools/build_screenai.sh', 'tools/screenai/**') }}
      - name: ScreenAI library
        run: ANDROID_NDK="$ANDROID_SDK_ROOT/ndk/29.0.14206865" tools/build_screenai.sh "$RUNNER_TEMP/screenai"
      - name: Build
        env:
          LFG_STOREFILE: ${{ runner.temp }}/release.jks
          LFG_STOREPASSWORD: ${{ secrets.LFG_STOREPASSWORD }}
          LFG_KEYALIAS: ${{ secrets.LFG_KEYALIAS }}
          LFG_KEYPASSWORD: ${{ secrets.LFG_KEYPASSWORD }}
          # The version code comes from this name (v0.1.16 is 1016): app/build.gradle.kts.
          LFG_VERSION_NAME: ${{ github.ref_name }}
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd app/build/outputs/apk/release
          for abi in arm64-v8a x86_64; do mv "app-$abi-release.apk" "LearnFromGames-$GITHUB_REF_NAME-$abi.apk"; done
          gh release create "$GITHUB_REF_NAME" LearnFromGames-*.apk --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
